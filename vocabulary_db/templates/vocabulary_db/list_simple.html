{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>{{ title }}</h2>
    <a href="{% url add_url %}" class="btn btn-primary">+ Ajouter</a>
</div>

<ul class="list-group">
    {% for item in items %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span>{{ item }}</span>
            <span>
                <a href="{% url edit_url pk=item.pk %}" class="btn btn-primary p-2 lh-1">Éditer</a>
                <a href="{% url delete_url pk=item.pk %}" class="btn btn-danger p-2 lh-1">Supprimer</a>
            </span>
        </li>
    {% endfor %}
</ul>

{% endblock %}
